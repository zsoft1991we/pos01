<script>
(function(){
'use strict';
var outer=document.getElementById('appFrame');
var css=`
@media(max-width:700px){
:root{--nav:58px}
html,body{min-width:320px;max-width:100vw;overflow-x:hidden;background:#f3f8f3}
body{padding-bottom:var(--nav)!important;font-size:12px!important}
/* HEADER */
.sidebar{display:none!important}
.content{margin-left:0!important;width:100%!important;min-width:0!important}
.topbar{padding:6px 8px 6px!important}

.status{font-size:7px!important;margin-top:0!important}

.search-shell{grid-template-columns:minmax(0,1fr) 36px!important;gap:5px!important;margin-top:5px!important}

.panel{border-radius:13px!important;box-shadow:0 6px 18px rgba(20,74,40,.06)!important}
.pagehead{gap:5px!important;margin-bottom:6px!important;align-items:center!important}

.pagehead p{display:none!important}
.btn{min-height:34px!important;padding:6px 8px!important;border-radius:9px!important;font-size:10px!important}

.posgrid{display:block!important}
.catalog{padding:6px!important;border-radius:13px!important}
.tabs{gap:4px!important;padding:0 0 5px!important;margin:0!important;overflow-x:auto!important;scrollbar-width:none!important}

/* CART */
.cart{position:fixed!important;left:5px!important;right:5px!important;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 5px)!important;top:auto!important;width:auto!important;height:min(69vh,560px)!important;min-height:0!important;max-height:calc(100vh - var(--nav) - 12px)!important;padding:9px!important;z-index:100!important;border-radius:16px!important;box-shadow:0 16px 45px rgba(15,60,31,.24)!important;transform:translate3d(0,calc(100% + 25px),0)!important;transition:transform .18s ease!important;overflow:hidden!important}
.cart.wb-mobile-open{transform:translate3d(0,0,0)!important}
.cart-head{min-height:30px!important}
.cart h2{font-size:14px!important}
.clear-cart{min-height:30px!important;padding:5px 7px!important;font-size:9px!important;border-radius:8px!important}
.cartlist{margin-top:5px!important;min-height:70px!important}
.lineitem{padding:6px!important;border-radius:9px!important}
.linehead strong{font-size:10px!important}
.lineprice{font-size:10px!important}
.step{gap:5px!important}
.step button{width:30px!important;height:30px!important;border-radius:8px!important}
.step span{min-width:15px!important;font-size:11px!important}
.summary{margin-top:5px!important;padding-top:5px!important}
.sumrow{font-size:10px!important;margin:3px 0!important}
.total{font-size:15px!important}
.pay{min-height:44px!important;padding:10px!important;border-radius:11px!important;font-size:14px!important;margin-top:6px!important}
.hybrid-help{font-size:8px!important}
/* FORMS / REPORTS */
.stockgrid{display:block!important}
.stockgrid>.formcard{margin-bottom:6px!important}
.formcard{padding:8px!important;border-radius:13px!important}
.formcard h2{font-size:14px!important;margin-bottom:8px!important}
.formrow{gap:5px!important;margin-bottom:6px!important}
.label{font-size:9px!important}
.field{padding:8px 9px!important;border-radius:9px!important;font-size:10px!important;min-height:36px!important}
.icon-picker{grid-template-columns:repeat(6,1fr)!important;gap:4px!important}
.icon-choice{min-height:34px!important;font-size:17px!important;border-radius:8px!important}
.tablewrap{overflow-x:auto!important;-webkit-overflow-scrolling:touch!important}
.table{font-size:9px!important;min-width:600px!important}
.table th,.table td{padding:6px 7px!important}
.metrics{grid-template-columns:1fr!important;gap:5px!important}
.metric{padding:9px!important;border-radius:12px!important}
.metric small{font-size:9px!important}
.metric .num{font-size:20px!important;margin-top:4px!important}
.reportgrid{display:block!important;margin-top:6px!important}
.chart,.top5{padding:9px!important;margin-bottom:6px!important;border-radius:13px!important}
.chartbox{height:160px!important}
.rank{padding:6px!important;margin-top:5px!important}
.ranknum{width:26px!important;height:26px!important}
.rankmeta b{font-size:10px!important}
.rankmeta span{font-size:8px!important}
/* LOGIN/PAYMENT/RECEIPT */
.login{padding:9px!important}
.loginbox{padding:16px!important;border-radius:18px!important}
.loginbrand{margin-bottom:11px!important}
.loginbrand strong{font-size:18px!important}
.loginbrand .logoMark{width:44px!important;height:44px!important}
.roles{gap:5px!important}
.rolebtn{min-height:40px!important;padding:7px!important;font-size:10px!important}
.hint{font-size:9px!important;padding:7px!important}
.modal{padding:5px!important}
.modalbox{width:100%!important;max-height:96vh!important;border-radius:16px!important;padding:10px!important}
.paytabs{margin:8px 0!important;padding:3px!important;border-radius:10px!important}
.paytabs button{min-height:36px!important;padding:6px 4px!important;font-size:10px!important}
.cashbig{font-size:23px!important}
.quick{gap:4px!important}
.quick button{min-height:36px!important;padding:6px 3px!important;font-size:10px!important;border-radius:9px!important}
.changebox{margin-top:8px!important;padding:10px!important;border-radius:12px!important}
.changebox strong{font-size:26px!important}
.confirm{min-height:42px!important;padding:10px!important;font-size:12px!important}
.receiptpage{padding:7px!important}
.successgrid{display:block!important}
.successbox{margin-bottom:6px!important;border-radius:15px!important;padding:12px!important}
.successbox .return{font-size:30px!important}
.receiptcard{padding:8px!important;border-radius:15px!important}
.receipt{max-width:100%!important}
/* BOTTOM NAV */
.wb-bottomnav{position:fixed!important;left:0!important;right:0!important;bottom:0!important;height:var(--nav)!important;background:#fff!important;border-top:1px solid #dbe7dd!important;display:flex!important;align-items:stretch!important;gap:1px!important;padding:4px 3px calc(4px + env(safe-area-inset-bottom))!important;z-index:150!important;box-sizing:border-box!important;overflow-x:auto!important;scrollbar-width:none!important}
.wb-bottomnav::-webkit-scrollbar{display:none}
.wb-bottomnav button{flex:1 0 62px!important;min-width:62px!important;min-height:46px!important;border:0!important;background:transparent!important;border-radius:9px!important;color:#61766a!important;font-size:8px!important;font-weight:900!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;gap:2px!important;padding:2px!important}
.wb-bottomnav button .wb-nav-ico{width:24px!important;height:24px!important;border-radius:7px!important;background:#eef5ef!important;display:grid!important;place-items:center!important;font-size:13px!important}
.wb-bottomnav button.active{color:#087438!important;background:#e6f5ea!important}
.wb-bottomnav button.active .wb-nav-ico{background:#0f9447!important;color:#fff!important}
.wb-cart{position:fixed!important;right:9px!important;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 9px)!important;z-index:155!important;border:0!important;background:#119447!important;color:#fff!important;border-radius:999px!important;min-width:84px!important;height:42px!important;padding:0 11px!important;font-weight:900!important;font-size:10px!important;box-shadow:0 8px 20px rgba(17,148,71,.25)!important;display:none!important;align-items:center!important;justify-content:center!important;white-space:nowrap!important}
.wb-cart.show{display:flex!important}
.wb-cart.bump{animation:wb-bump .2s ease}
@keyframes wb-bump{50%{transform:scale(1.05)}}
.wb-scrim{position:fixed!important;inset:0!important;background:rgba(12,38,22,.28)!important;z-index:90!important;display:none!important}
.wb-scrim.show{display:block!important}
}
`;
function getVoid(){try{return outer.contentDocument||null}catch(e){return null}}
function getCoreFrame(){var d=getVoid();return d?d.getElementById('appFrame'):null}
function getCore(){try{var f=getCoreFrame();return f?f.contentDocument:null}catch(e){return null}}
function mobile(){return window.matchMedia&&window.matchMedia('(max-width:700px)').matches}
function inject(d){if(!d||!d.head)return;if(!d.getElementById('wb11style')){var s=d.createElement('style');s.id='wb11style';s.textContent=css;d.head.appendChild(s)}}
function sync(d,nav){var src=[].slice.call(d.querySelectorAll('.side-nav button')),dst=[].slice.call(nav.querySelectorAll('button'));dst.forEach(function(b,i){b.classList.toggle('active',!!(src[i]&&src[i].classList.contains('active')))});}
function makeNav(d){if(!mobile())return;var side=d.querySelector('.side-nav');if(!side)return;var nav=d.getElementById('wb11nav');if(!nav){nav=d.createElement('nav');nav.id='wb11nav';nav.className='wb-bottomnav';d.body.appendChild(nav)}var src=[].slice.call(side.querySelectorAll('button'));var sig=src.map(function(b){return(b.innerText||'').trim()}).join('|');if(nav.dataset.sig!==sig){nav.dataset.sig=sig;nav.innerHTML='';src.forEach(function(x,i){var b=d.createElement('button');b.type='button';b.dataset.i=i;var ic=d.createElement('span');ic.className='wb-nav-ico';ic.textContent=(x.querySelector('.ico')||{}).textContent||'•';var tx=d.createElement('span');var c=x.cloneNode(true),ico=c.querySelector('.ico');if(ico)ico.remove();tx.textContent=(c.textContent||'').replace(/\s+/g,' ').trim();b.appendChild(ic);b.appendChild(tx);b.onclick=function(){closeCart(d);x.click();setTimeout(function(){sync(d,nav)},120)};nav.appendChild(b)})}sync(d,nav)}
function closeCart(d){var c=d.querySelector('.cart');if(c)c.classList.remove('wb-mobile-open');var s=d.getElementById('wb11scrim');if(s)s.classList.remove('show');var b=d.getElementById('wb11cart');if(b)b.textContent='Keranjang'}
function updateCart(d){var c=d.querySelector('.cart'),b=d.getElementById('wb11cart');if(!c||!b)return;var items=c.querySelectorAll('.lineitem');if(!items.length){b.classList.remove('show');closeCart(d);return}var q=0;[].forEach.call(items,function(it){var m=(it.innerText||'').match(/×\s*(\d+)/);q+=m?Number(m[1]):1});var t=c.querySelector('.total');b.textContent='Keranjang · '+q+(t&&t.innerText?' · '+t.innerText.trim():'');b.classList.add('show')}
function makeCart(d){if(!mobile())return;var c=d.querySelector('.cart');if(!c)return;var b=d.getElementById('wb11cart');if(!b){b=d.createElement('button');b.id='wb11cart';b.className='wb-cart';b.type='button';b.textContent='Keranjang';d.body.appendChild(b);b.onclick=function(){var open=c.classList.toggle('wb-mobile-open');var s=d.getElementById('wb11scrim');if(s)s.classList.toggle('show',open);if(!open)b.textContent='Keranjang'}}var s=d.getElementById('wb11scrim');if(!s){s=d.createElement('div');s.id='wb11scrim';s.className='wb-scrim';d.body.appendChild(s);s.onclick=function(){closeCart(d)}}updateCart(d)}
function setup(){var d=getCore();if(!d||!d.body)return;inject(d);if(mobile()){makeNav(d);makeCart(d)}}
outer.addEventListener('load',function(){setTimeout(setup,150);setTimeout(setup,500);setTimeout(setup,1200);setTimeout(setup,2500);try{var v=getVoid(),f=v&&v.getElementById('appFrame');if(f)f.addEventListener('load',function(){setTimeout(setup,120)})}catch(e){}});
setInterval(setup,1200);
window.addEventListener('resize',setup);
})();
</script>
