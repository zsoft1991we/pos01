<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Warung Bahagia POS V1.1 Mobile</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f8f3}
#appFrame{width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
<iframe id="appFrame" src="warung-bahagia-v1.0-final.html?v=11" title="Warung Bahagia POS V1.1"></iframe>
<script>
(function(){
  var outer=document.getElementById('appFrame');
  var css='@media(max-width:700px){html,body{min-width:320px;max-width:100%;overflow-x:hidden}body{padding-bottom:66px!important}.sidebar{display:none!important}.content{margin-left:0!important;width:100%!important;min-width:0!important}.topbar{padding:8px 10px!important}.topbar-row{grid-template-columns:1fr!important;gap:7px!important}.welcome b{font-size:15px!important}.welcome small{font-size:10px!important}.clockbox{display:none!important}.top-user{position:absolute!important;top:8px!important;right:10px!important;transform:scale(.9)!important}.top-user>div:first-child{display:none!important}.search-shell{grid-template-columns:minmax(0,1fr) 42px!important;gap:6px!important}.search-box{min-height:42px!important;border-radius:13px!important}.search-box input{font-size:12px!important}.camera{width:42px!important;height:42px!important;border-radius:12px!important}main{padding:9px!important}.panel{border-radius:16px!important}.posgrid{display:block!important}.catalog{padding:9px!important}.tabs{gap:6px!important;overflow-x:auto!important}.tabs button{padding:8px 11px!important;font-size:11px!important}.products{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important}.product{border-radius:14px!important}.pic{height:92px!important;font-size:39px!important}.pic img{padding:7px!important}.pbody{padding:8px!important}.pname{font-size:11px!important;min-height:28px}.price{font-size:12px!important}.stock,.soldout{font-size:9px!important}.cart{position:fixed!important;left:8px!important;right:8px!important;bottom:73px!important;top:auto!important;width:auto!important;height:72vh!important;min-height:0!important;max-height:72vh!important;padding:12px!important;z-index:80!important;border-radius:20px!important;box-shadow:0 20px 60px rgba(15,60,31,.26)!important;transform:translateY(calc(100% + 30px));transition:transform .2s ease!important;overflow:hidden!important}.cart.wb-mobile-open{transform:translateY(0)!important}.step button{width:32px!important;height:32px!important}.pay{padding:14px!important;font-size:16px!important}.stockgrid{display:block!important}.metrics{grid-template-columns:1fr!important}.reportgrid{display:block!important}.chartbox{height:190px!important}.modal{padding:8px!important}.modalbox{width:100%!important;max-height:94vh!important;border-radius:21px!important;padding:14px!important}.receiptpage{padding:10px!important}.successgrid{display:block!important}.successbox{margin-bottom:9px!important;padding:17px!important}.receiptcard{padding:12px!important}.wb-bottomnav{position:fixed;left:0;right:0;bottom:0;height:66px;background:rgba(255,255,255,.97);border-top:1px solid #dbe7dd;display:flex;z-index:120;padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-sizing:border-box;overflow-x:auto}.wb-bottomnav button{flex:1 0 72px;border:0;background:transparent;border-radius:12px;color:#61766a;font-size:9px;font-weight:900}.wb-bottomnav button.active{color:#087438;background:#e6f5ea}.wb-cart{position:fixed;right:12px;bottom:80px;z-index:125;border:0;background:#119447;color:#fff;border-radius:999px;min-width:88px;height:48px;padding:0 14px;font-weight:900;font-size:12px;box-shadow:0 10px 25px rgba(17,148,71,.28)}.wb-scrim{position:fixed;inset:0;background:rgba(12,38,22,.32);z-index:70}.hidden-mobile{display:none!important}}';
  function core(){try{var v=outer.contentDocument;var f=v&&v.getElementById('appFrame');return f&&f.contentDocument}catch(e){return null}}
  function setup(){var d=core();if(!d||!d.head||!d.body)return; if(!d.getElementById('wb11style')){var s=d.createElement('style');s.id='wb11style';s.textContent=css;d.head.appendChild(s)}; if(window.matchMedia&&window.matchMedia('(max-width:700px)').matches) mobile(d)}
  function mobile(d){var side=d.querySelector('.side-nav');var nav=d.getElementById('wb11nav');if(!nav){nav=d.createElement('div');nav.id='wb11nav';nav.className='wb-bottomnav';d.body.appendChild(nav)}; if(side&&!nav.dataset.ready){nav.dataset.ready='1';var bs=side.querySelectorAll('button');for(var i=0;i<bs.length;i++){(function(src){var b=d.createElement('button');b.type='button';b.innerHTML=src.innerHTML.replace(/<[^>]*>[^<]*<\/?[^>]*>/g,'')+'<div>'+String(src.textContent||'').trim().replace(/^\S+\s*/,'')+'</div>';b.onclick=function(){src.click();setTimeout(function(){sync(d,nav)},80)};nav.appendChild(b)})(bs[i])}};sync(d,nav);var cart=d.querySelector('.cart');if(cart&&!d.getElementById('wb11cart')){var c=d.createElement('button');c.id='wb11cart';c.className='wb-cart';c.textContent='Keranjang';d.body.appendChild(c);var scr=d.createElement('div');scr.id='wb11scrim';scr.className='wb-scrim hidden-mobile';d.body.appendChild(scr);c.onclick=function(){cart.classList.toggle('wb-mobile-open');scr.classList.toggle('hidden-mobile')};scr.onclick=function(){cart.classList.remove('wb-mobile-open');scr.classList.add('hidden-mobile')}}}
  function sync(d,nav){var bs=d.querySelectorAll('.side-nav button');var ns=nav.querySelectorAll('button');for(var i=0;i<ns.length;i++)ns[i].classList.toggle('active',!!(bs[i]&&bs[i].classList.contains('active')))}
  function wait(){setup();setTimeout(setup,300);setTimeout(setup,1000);setTimeout(setup,2500)}
  outer.addEventListener('load',wait);setTimeout(wait,1000);window.addEventListener('resize',setup)
})();
</script>
</body>
</html>
