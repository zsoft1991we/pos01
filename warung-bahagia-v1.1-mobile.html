function getVoid(){try{return frame.contentDocument||null}catch(e){return null}}function getCoreFrame(){return getVoid()?.getElementById('appFrame')||null}function getCore(){try{return getCoreFrame()?.contentDocument||null}catch(e){return null}}
function inject(){const d=getCore();if(!d?.head)return false;if(!d.getElementById('__wb_v11_css')){const s=d.createElement('style');s.id='__wb_v11_css';s.textContent=css;d.head.appendChild(s)}coreDoc=d;ensure(d);return true}
function escapeHtml(s){return String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}
function ensure(d){if(!d.body)return;let nav=d.getElementById('__wb_mobile_bottomnav');if(!nav){nav=d.createElement('div');nav.id='__wb_mobile_bottomnav';nav.className='__wb_mobile_bottomnav';d.body.appendChild(nav)}rebuildNav(d,nav);let scr=d.getElementById('__wb_cart_scrim');if(!scr){scr=d.createElement('div');scr.id='__wb_cart_scrim';scr.className='__wb_cart_scrim';d.body.appendChild(scr)}let cb=d.getElementById('__wb_mobile_cart');if(!cb){cb=d.createElement('button');cb.id='__wb_mobile_cart';cb.className='__wb_mobile_cart';cb.type='button';d.body.appendChild(cb);cb.onclick=()=>toggle(d)}updateCart(d,cb);scr.onclick=()=>close(d)}
function rebuildNav(d,nav){const side=d.querySelector('.side-nav');if(!side)return;const srcs=[...side.querySelectorAll('button')];const sig=srcs.map(b=>(b.innerText||'').trim()).join('|');if(nav.dataset.sig===sig)return;nav.dataset.sig=sig;nav.innerHTML='';srcs.forEach((src,i)=>{const b=d.createElement('button');b.type='button';b.className='__wb_mobile_navbtn';const ico=src.querySelector('.ico')?.outerHTML||'<span class="ico">•</span>';const text=(src.innerText||'').replace(/\s+/g,' ').trim().replace(/^\S+\s*/,'');b.innerHTML=ico+'<span>'+escapeHtml(text)+'</span>';b.onclick=()=>{src.click();setTimeout(()=>syncNav(d),100)};b.dataset.source=i;nav.appendChild(b)});syncNav(d)}
function syncNav(d){const side=[...d.querySelectorAll('.side-nav button')],nav=[...d.querySelectorAll('.__wb_mobile_navbtn')];nav.forEach((b,i)=>b.classList.toggle('active',!!side[i]?.classList.contains('active')))}
function toggle(d){const cart=d.querySelector('.cart');if(!cart)return;const open=cart.classList.toggle('is-open');d.getElementById('__wb_cart_scrim')?.classList.toggle('show',open);const b=d.getElementById('__wb_mobile_cart');if(b)b.textContent=open?'Tutup':'Keranjang'}
function close(d){d.querySelector('.cart')?.classList.remove('is-open');d.getElementById('__wb_cart_scrim')?.classList.remove('show');const b=d.getElementById('__wb_mobile_cart');if(b)b.textContent='Keranjang'}
function updateCart(d,b){const cart=d.querySelector('.cart');if(!cart){b.classList.remove('show');return}b.classList.add('show');const total=cart.querySelector('.total')?.innerText||'';b.textContent=cart.querySelector('.lineitem')?('Keranjang'+(total?' · '+total:'')):'Keranjang'}
function refresh(){if(!inject())return;ensure(coreDoc);const b=coreDoc.getElementById('__wb_mobile_cart');if(b)updateCart(coreDoc,b);syncNav(coreDoc)}
frame.addEventListener('load',()=>setTimeout(()=>{const vf=getCoreFrame();if(!vf)return;vf.addEventListener('load',()=>setTimeout(()=>{refresh();try{observer?.disconnect();observer=new MutationObserver(()=>refresh());observer.observe(coreDoc.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class']})}catch(e){}},80));if(vf.contentDocument?.readyState==='complete'){refresh();try{observer=new MutationObserver(()=>refresh());observer.observe(coreDoc.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class']})}catch(e){}}},80));window.addEventListener('resize',refresh);})();
