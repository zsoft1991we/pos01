<script>
(function(){'use strict';
const frame=document.getElementById('appFrame');
function d(){try{return frame.contentDocument}catch(e){return null}}
function visible(el){if(!el)return false;const s=el.ownerDocument.defaultView.getComputedStyle(el);return s.display!=='none'&&s.visibility!=='hidden'&&s.opacity!=='0'}
function fix(){const doc=d();if(!doc)return;const receipt=doc.querySelector('.receiptpage');const on=visible(receipt);
let style=doc.getElementById('wbv11v5');
if(!style){style=doc.createElement('style');style.id='wbv11v5';style.textContent=`
html,body{max-width:100vw!important;overflow-x:hidden!important}
.topbar-row{min-width:0!important}.welcome{min-width:0!important;padding-right:74px!important;overflow:hidden!important}.welcome b{display:block!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}.top-user{right:6px!important;max-width:70px!important}.top-user .avatar{flex:none!important}
.receiptpage{height:100vh!important;min-height:100vh!important;box-sizing:border-box!important;padding:8px!important;overflow-y:auto!important;overflow-x:hidden!important}.successgrid{display:block!important;width:100%!important;max-width:430px!important;margin:0 auto!important}.successbox{margin:0 0 8px!important;padding:14px!important;border-radius:15px!important}.successbox .return{font-size:30px!important}.receiptcard{padding:10px!important;margin:0!important;border-radius:15px!important}.receipt{width:100%!important;max-width:350px!important;box-sizing:border-box!important;margin:0 auto!important}.receiptpage *{box-sizing:border-box!important}
body.wb-receipt-mode{padding-bottom:0!important;overflow:hidden!important}body.wb-receipt-mode #wbv11nav,body.wb-receipt-mode #wbv11cart,body.wb-receipt-mode #wbv11scrim{display:none!important}.cart.wb11-open{transform:translate3d(0,0,0)!important}
`;
doc.head.appendChild(style)}
doc.body.classList.toggle('wb-receipt-mode',on);
if(on){const nav=doc.getElementById('wbv11nav');const cart=doc.getElementById('wbv11cart');const scr=doc.getElementById('wbv11scrim');if(nav)nav.style.display='none';if(cart)cart.style.display='none';if(scr)scr.style.display='none';window.scrollTo?.(0,0)}
}
frame.addEventListener('load',()=>{setTimeout(fix,100);setInterval(fix,500)});setInterval(fix,500);fix();
})();
