<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>Warung Bahagia POS V1.1 Mobile</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f8f3}#shell{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="shell" src="warung-bahagia-v1.1-mobile-v4.html?v=mobile8" title="Warung Bahagia POS V1.1 Mobile"></iframe>
<script>
(function(){'use strict';
 const shell=document.getElementById('shell');
 function coreDoc(){try{const mid=shell.contentDocument?.querySelector('#appFrame');return mid?.contentDocument||null}catch(e){return null}}
 function patch(){
  const d=coreDoc(); if(!d||!d.body)return;
  let st=d.getElementById('wbv11v8');
  if(!st){
   st=d.createElement('style');st.id='wbv11v8';st.textContent=`
html,body{max-width:100vw!important;overflow-x:hidden!important}
/* cart is moved to body and behaves like a true mobile sheet */
.cart{position:fixed!important;left:6px!important;right:6px!important;bottom:64px!important;top:auto!important;width:auto!important;height:min(66dvh,520px)!important;min-height:0!important;max-height:calc(100dvh - 76px)!important;padding:12px!important;z-index:10001!important;background:#fff!important;border-radius:18px!important;box-shadow:0 20px 60px rgba(15,60,31,.30)!important;overflow:hidden!important;transform:none!important;transition:none!important;display:none!important}
.cart.wb11-open{display:flex!important}
.cartlist{min-height:60px!important;overflow:auto!important}
.pay{position:relative!important;z-index:2!important;min-height:48px!important;font-size:15px!important}
#wbv11scrim{z-index:10000!important}
#wbv11cart{z-index:10002!important}
#wbv11nav{z-index:9000!important}
/* clean header on handset */
.topbar-row{display:block!important;position:relative!important;min-width:0!important}
.welcome{display:block!important;max-width:calc(100vw - 82px)!important;min-width:0!important;padding-right:0!important;overflow:hidden!important}
.welcome b{display:block!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
.top-user{position:absolute!important;right:0!important;top:0!important;max-width:70px!important}
.top-user>div:first-child{display:none!important}
.top-user .avatar{width:30px!important;height:30px!important}
`;
   d.head.appendChild(st);
  }
  const cart=d.querySelector('.cart');
  if(cart && cart.parentElement!==d.body){d.body.appendChild(cart)}
 }
 shell.addEventListener('load',()=>{setTimeout(patch,200);setTimeout(patch,800);setInterval(patch,800)});
 setInterval(patch,800);
})();
</script>
</body></html>
