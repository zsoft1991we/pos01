<style>
.order-detail-card{max-width:760px!important;padding:0!important;overflow:hidden;background:#fffdf8;border:1px solid rgba(43,91,72,.10);box-shadow:0 24px 70px rgba(32,61,49,.20)}
.order-detail-header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid #eee7dd;background:linear-gradient(180deg,#f8fcf8,#fffdf8)}
.order-brand{display:flex;align-items:center;gap:12px}
.order-logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:#2f6f4e;color:#fff;font-weight:900;letter-spacing:.5px}
.order-title{font-size:20px;font-weight:900;color:#274537}
.order-subtitle{font-size:11px;color:#718579;margin-top:2px}
.order-meta-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#eee7dd;border-bottom:1px solid #eee7dd}
.order-meta{padding:12px 14px;background:#fff;display:flex;flex-direction:column;gap:4px}
.order-meta span{font-size:10px;color:#7d8d84;text-transform:uppercase;letter-spacing:.6px}
.order-meta b{font-size:12px;color:#294437;word-break:break-word}
.status-pill{display:inline-flex;align-self:flex-start;padding:4px 8px;border-radius:999px;background:#eaf5ee;color:#24714a;font-size:10px!important}
.order-section{padding:16px 20px 8px}
.section-label{font-size:10px;font-weight:900;letter-spacing:.9px;color:#789084;margin-bottom:9px}
.order-items{border:1px solid #eee7dd;border-radius:14px;overflow:hidden;background:#fff}
.order-item{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:11px 12px;border-bottom:1px solid #f1ece5}
.order-item:last-child{border-bottom:0}
.item-index{width:25px;height:25px;border-radius:8px;background:#eef6f0;color:#2f6f4e;display:grid;place-items:center;font-size:10px;font-weight:900}
.item-main{display:flex;flex-direction:column;gap:3px;min-width:0}
.item-main b{font-size:12px;color:#294437;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-main span{font-size:10px;color:#7b8b83}
.item-total{font-size:12px;color:#294437;white-space:nowrap}
.order-summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:10px 20px 16px}
.payment-summary,.totals-summary{border:1px solid #eee7dd;border-radius:14px;padding:13px;background:#fff}
.summary-row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed #ebe4db;font-size:11px;color:#6f8178}
.summary-row:last-child{border-bottom:0}
.summary-row b{color:#294437;text-align:right}
.change-value{color:#2f7a50!important}
.grand-total-row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding:12px;border-radius:12px;background:#edf7ef;color:#2c6648;font-weight:900;font-size:13px}
.order-print-sheet{display:none}.order-print-sheet .receipt{max-width:350px;margin:auto}
.order-actions{padding:14px 20px 18px;border-top:1px solid #eee7dd;background:#fff}
@media(max-width:700px){
 .order-meta-grid{grid-template-columns:1fr 1fr}
 .order-summary-grid{grid-template-columns:1fr}
 .order-detail-header{padding:14px 16px}
 .order-section,.order-summary-grid{padding-left:16px;padding-right:16px}
 .order-actions{padding-left:16px;padding-right:16px}
}
@media print{
 body *{visibility:hidden!important}
 /* Jalur cetak dari POS / Transaksi Berhasil */
 .receiptpage .receipt,.receiptpage .receipt *{visibility:visible!important}
 .receiptpage .receipt{display:block!important;position:absolute!important;left:0!important;top:0!important;width:78mm!important;max-width:350px!important;margin:0!important;border:1px dashed #b8cbbd!important;background:#fbfefb!important;padding:17px!important;font:13px/1.45 monospace!important;color:#000!important}
 .receiptpage .center{text-align:center!important}
 .receiptpage .dash{border-top:1px dashed #cdbcae!important;margin:13px 0!important}
 .receiptpage .rrow{display:flex!important;justify-content:space-between!important}
 /* Jalur cetak dari Pesanan / Detail */
 #orderreceipt,#orderreceipt *{visibility:visible!important}
 #orderreceipt{display:block!important;position:absolute!important;left:0!important;top:0!important;width:78mm!important;padding:0!important;background:#fff!important;color:#000!important}
 #orderreceipt .receipt{display:block!important;max-width:350px!important;margin:0!important;border:1px dashed #b8cbbd!important;background:#fbfefb!important;padding:17px!important;font:13px/1.45 monospace!important;color:#000!important}
 #orderreceipt .center{text-align:center!important}
 #orderreceipt .dash{border-top:1px dashed #cdbcae!important;margin:13px 0!important}
 #orderreceipt .rrow{display:flex!important;justify-content:space-between!important}
 .order-detail-card{box-shadow:none!important;border:0!important}
}
</style>

<style>

<style>

function restockRecommendationsHTML(){
 const products=[...(state.products||[])];
 const critical=products
   .filter(p=>Number(p.stock||0)<=Number(p.minimum_stock||0))
   .sort((a,b)=>{
     const az=Number(a.stock||0)===0, bz=Number(b.stock||0)===0;
     if(az!==bz)return bz-az;
     const ag=Number(a.minimum_stock||0)-Number(a.stock||0);
     const bg=Number(b.minimum_stock||0)-Number(b.stock||0);
     return bg-ag;
   })
   .slice(0,5);
 if(!critical.length){
   return `<div class="restock-empty"><span class="restock-check">✓</span><div><b>Stok masih aman</b><small>Belum ada barang yang mencapai batas minimum stok.</small></div></div>`;
 }
 return `<div class="restock-list">${critical.map(p=>{
   const stock=Number(p.stock||0), min=Number(p.minimum_stock||0);
   const isOut=stock===0, deficit=Math.max(min-stock,0);
   const suggested=Math.max(min*2-stock, min-stock, 1);
   return `<div class="restock-item">
     <div class="restock-icon">${p.image?`<img src="${p.image}" alt="">`:esc(p.emo||'🛍️')}</div>
     <div class="restock-main">
       <b>${esc(p.name)}</b>
       <span>${isOut?'HABIS':`Stok ${stock}`} · Min ${min} ${esc(p.unit||'pcs')}</span>
     </div>
     <div class="restock-action">
       <span class="${isOut?'restock-danger':'restock-warn'}">${isOut?'HABIS':'MENIPIS'}</span>
       <small>+${suggested} ${esc(p.unit||'pcs')}</small>
     </div>
   </div>`;
 }).join('')}</div>`
}

function stockAnalysis(){
 const ps=[...(state.products||[])];
 const inventoryCost=ps.reduce((a,p)=>a+Number(p.stock||0)*Number(p.buy||0),0);
 const inventoryRetail=ps.reduce((a,p)=>a+Number(p.stock||0)*Number(p.price||0),0);
 const low=ps.filter(p=>Number(p.stock||0)>0 && Number(p.stock||0)<=Number(p.minimum_stock||0)).length;
 const out=ps.filter(p=>Number(p.stock||0)<=0).length;
 const valueMargin=inventoryRetail-inventoryCost;
 const priorities=ps.filter(p=>Number(p.stock||0)<=Number(p.minimum_stock||0))
   .sort((a,b)=>{
     const ao=Number(a.stock||0)===0, bo=Number(b.stock||0)===0;
     if(ao!==bo)return bo-ao;
     const ad=Number(a.minimum_stock||0)-Number(a.stock||0);
     const bd=Number(b.minimum_stock||0)-Number(b.stock||0);
     return bd-ad;
   }).slice(0,6);
 return {inventoryCost,inventoryRetail,valueMargin,low,out,priorities};
}

function trendChartHTML(rd){
 const data=rd.trend||[];
 if(!data.length) return `<section class="panel trend-panel"><div class="empty" style="height:220px">Belum ada data trend pada periode ini.</div></section>`;
 const w=900,h=275,padL=46,padR=18,padT=20,padB=36;
 const max=Math.max(...data.map(x=>Math.max(x.revenue,x.profit,0)),1);
 const min=Math.min(...data.map(x=>Math.min(x.profit,0)),0);
 const span=Math.max(max-min,1);
 const x=i=>padL+(i/(Math.max(data.length-1,1)))*(w-padL-padR);
 const y=v=>padT+((max-v)/span)*(h-padT-padB);
 const revenuePts=data.map((d,i)=>`${x(i).toFixed(1)},${y(d.revenue).toFixed(1)}`);
 const profitPts=data.map((d,i)=>`${x(i).toFixed(1)},${y(d.profit).toFixed(1)}`);
 const zeroY=y(0), baseY=h-padB;
 const revenueArea=`${x(0)},${baseY} ${revenuePts.join(' ')} ${x(data.length-1)},${baseY}`;
 const profitArea=`${x(0)},${baseY} ${profitPts.join(' ')} ${x(data.length-1)},${baseY}`;
 const gridCount=4;
 const grid=Array.from({length:gridCount+1},(_,i)=>{ const v=max-(span/gridCount)*i; const yy=y(v); return `<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${w-padR}" y2="${yy.toFixed(1)}" class="trend-grid"/>`; }).join('');
 const labels=data.map((d,i)=>({d,i})).filter(({i})=>{ if(data.length<=7)return true; if(data.length<=14)return i%2===0||i===data.length-1; return i%5===0||i===data.length-1; }).map(({d,i})=>`<text x="${x(i)}" y="${h-10}" text-anchor="middle" class="trend-label">${esc(d.label)}</text>`).join('');
 const revenueDots=data.length<=12?data.map((d,i)=>`<circle cx="${x(i)}" cy="${y(d.revenue)}" r="3.8" class="trend-dot revenue-dot"/>`).join(''):'';
 const profitDots=data.length<=12?data.map((d,i)=>`<circle cx="${x(i)}" cy="${y(d.profit)}" r="3.8" class="trend-dot profit-dot"/>`).join(''):'';
 return `<section class="panel trend-panel">
   <div class="trend-head">
     <div><h3 style="margin:0">Trend Omzet & Laba Kotor</h3><div class="trend-sub">Grafik area menunjukkan volume omzet dan laba kotor pada periode yang dipilih</div></div>
     <div class="trend-legend"><span><i class="dot revenue"></i>Omzet</span><span><i class="dot profit"></i>Laba Kotor</span></div>
   </div>
   <div class="trend-chart">
    <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-label="Grafik area omzet dan laba kotor">
      <defs>
        <linearGradient id="revenueFill" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#3b82f6" stop-opacity="0.28"/><stop offset="100%" stop-color="#3b82f6" stop-opacity="0.035"/></linearGradient>
        <linearGradient id="profitFill" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#16a34a" stop-opacity="0.24"/><stop offset="100%" stop-color="#16a34a" stop-opacity="0.03"/></linearGradient>
      </defs>
      ${grid}
      <line x1="${padL}" y1="${zeroY}" x2="${w-padR}" y2="${zeroY}" class="trend-zero"/>
      <polygon points="${revenueArea}" class="trend-area revenue-area"/>
      <polygon points="${profitArea}" class="trend-area profit-area"/>
      <polyline points="${revenuePts.join(' ')}" class="trend-line revenue-line"/>
      <polyline points="${profitPts.join(' ')}" class="trend-line profit-line"/>
      ${revenueDots}${profitDots}${labels}
    </svg>
   </div>
   <div class="trend-summary"><span>Omzet <b>${rupiah(data.reduce((a,d)=>a+d.revenue,0))}</b></span><span>Laba Kotor <b>${rupiah(data.reduce((a,d)=>a+d.profit,0))}</b></span></div>
 </section>`
}

function insightHTML(rd){
 const revenue=Number(rd.revenue||0), prev=Number(rd.previousRevenue||0);
 let perfTitle='Belum ada pembanding', perfText='Data periode pembanding belum tersedia.', perfClass='';
 if(prev>0){
   const pct=((revenue-prev)/prev)*100;
   const dir=pct>0?'naik':pct<0?'turun':'tetap';
   perfTitle=`Omzet ${dir} ${Math.abs(pct).toFixed(0)}%`;
   perfText=`Periode ini ${rupiah(revenue)} vs ${rupiah(prev)} pada periode sebelumnya.`;
   perfClass=pct>0?'good':pct<0?'warn':'';
 }else if(revenue>0){
   perfTitle='Omzet mulai terbentuk';
   perfText=`Periode ini menghasilkan ${rupiah(revenue)}, belum ada omzet pembanding.`;
   perfClass='good';
 }else{
   perfTitle='Belum ada penjualan';
   perfText='Belum ada transaksi paid pada periode yang dipilih.';
   perfClass='warn';
 }
 const top=rd.top&&rd.top.length?rd.top[0]:null;
 const topTitle=top?esc(top.name):'Belum ada produk terlaris';
 const topText=top?`${top.qty} unit · omzet ${rupiah(top.revenue)}`:'Belum ada produk terjual pada periode ini.';
 const restocks=(state.products||[]).filter(p=>Number(p.stock||0)<=Number(p.minimum_stock||0));
 const out=restocks.filter(p=>Number(p.stock||0)<=0).length;
 const stockTitle=restocks.length?`${restocks.length} barang perlu perhatian`:'Stok aman';
 const stockText=restocks.length?(out?`${out} barang habis. Segera lakukan restok.`:'Stok menipis di bawah/menyamai batas minimum.'):'Tidak ada barang di bawah batas minimum.';
 const stockClass=out?'alert':restocks.length?'warn':'good';
 return `<section class="panel insight-panel">
   <div class="insight-head"><h3>Insight Otomatis</h3><span>Ringkasan yang membantu pemilik mengambil keputusan</span></div>
   <div class="insight-grid">
    <div class="insight-card ${perfClass}"><small>Performa Penjualan</small><b>${perfTitle}</b><p>${perfText}</p></div>
    <div class="insight-card ${top?'good':''}"><small>Produk Terlaris</small><b>${topTitle}</b><p>${topText}</p></div>
    <div class="insight-card ${stockClass}"><small>Kondisi Stok</small><b>${stockTitle}</b><p>${stockText}</p></div>
   </div>
 </section>`;
}

function dateShort(v){return v?new Date(v+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}):'-'}

async function loadReportData(){
 if(!state.appUserId)return;
 let from,to;
 const now=new Date();
 if(state.reportPeriod==='today'){
   const s=new Date(now);s.setHours(0,0,0,0);from=s;const e=new Date(s);e.setDate(e.getDate()+1);to=e;
 }else if(state.reportPeriod==='7d'){
   const s=new Date(now);s.setHours(0,0,0,0);s.setDate(s.getDate()-6);from=s;const e=new Date(now);e.setHours(0,0,0,0);e.setDate(e.getDate()+1);to=e;
 }else if(state.reportPeriod==='month'){
   from=new Date(now.getFullYear(),now.getMonth(),1);from.setHours(0,0,0,0);to=new Date(now.getFullYear(),now.getMonth()+1,1);
 }else{
   if(!state.reportFrom||!state.reportTo)return;
   from=new Date(state.reportFrom+'T00:00:00');to=new Date(state.reportTo+'T00:00:00');to.setDate(to.getDate()+1);
 }
 const {data:txs,error}=await sb.from('transactions')
   .select('id,transaction_at,grand_total,status,payment_method,transaction_items(product_id,product_name,quantity,unit_price,purchase_price,subtotal)')
   .gte('transaction_at',from.toISOString()).lt('transaction_at',to.toISOString()).eq('status','paid');
 if(error){toast('Gagal memuat laporan: '+error.message);return}
 const rows=txs||[], methods={cash:0,qris:0,debit:0}, hourly=Array(24).fill(0), products={};
 let revenue=0,cogs=0;
 const periodMs=to.getTime()-from.getTime();
 const prevTo=new Date(from);
 const prevFrom=new Date(from.getTime()-periodMs);
 let previousRevenue=0;
 try{
   const {data:prevRows,error:prevErr}=await sb.from('transactions').select('grand_total,status').gte('transaction_at',prevFrom.toISOString()).lt('transaction_at',prevTo.toISOString()).eq('status','paid');
   if(!prevErr)previousRevenue=(prevRows||[]).reduce((a,t)=>a+Number(t.grand_total||0),0);
 }catch(e){ console.warn('Previous period query failed',e); }
 for(const t of rows){
   const totalTx=Number(t.grand_total||0);revenue+=totalTx;
   methods[t.payment_method]=(methods[t.payment_method]||0)+totalTx;
   const d=new Date(t.transaction_at);hourly[d.getHours()]+=totalTx;
   for(const i of (t.transaction_items||[])){
     const qty=Number(i.quantity||0), sales=Number(i.subtotal||0), hpp=Number(i.purchase_price||0)*qty;
     cogs+=hpp;
     const key=i.product_id||i.product_name;
     if(!products[key])products[key]={name:i.product_name||'Produk',qty:0,revenue:0,cogs:0,profit:0};
     products[key].qty+=qty;products[key].revenue+=sales;products[key].cogs+=hpp;products[key].profit+=sales-hpp;
   }
 }
 // Daily/hourly trend: today is more useful by hour; longer periods by calendar day.
 const trend=[];
 if(state.reportPeriod==='today'){
   const bucket=Array(24).fill(0).map((_,h)=>({label:String(h).padStart(2,'0'),revenue:0,profit:0}));
   for(const t of rows){
     const d=new Date(t.transaction_at), h=d.getHours();
     const sales=Number(t.grand_total||0);
     const txProfit=(t.transaction_items||[]).reduce((a,i)=>a+Number(i.subtotal||0)-Number(i.purchase_price||0)*Number(i.quantity||0),0);
     bucket[h].revenue+=sales; bucket[h].profit+=txProfit;
   }
   trend.push(...bucket);
 }else{
   const days=Math.max(1,Math.ceil((to-from)/86400000));
   for(let n=0;n<days;n++){
     const d=new Date(from);d.setDate(d.getDate()+n);
     trend.push({label:d.toLocaleDateString('id-ID',{day:'2-digit',month:'short'}),revenue:0,profit:0});
   }
   const index=new Map(trend.map((_,i)=>{
     const d=new Date(from);d.setDate(d.getDate()+i);d.setHours(0,0,0,0);
     return [d.toISOString().slice(0,10),i];
   }));
   for(const t of rows){
     const d=new Date(t.transaction_at);d.setHours(0,0,0,0);
     const i=index.get(d.toISOString().slice(0,10));if(i==null)continue;
     trend[i].revenue+=Number(t.grand_total||0);
     trend[i].profit+=(t.transaction_items||[]).reduce((a,it)=>a+Number(it.subtotal||0)-Number(it.purchase_price||0)*Number(it.quantity||0),0);
   }
 }
 const all=Object.values(products);
 const top=[...all].sort((a,b)=>b.qty-a.qty).slice(0,5);
 const slow=[...all].sort((a,b)=>a.qty-b.qty||a.revenue-b.revenue).slice(0,5);
 state.reportData={revenue,count:rows.length,profit:revenue-cogs,cogs,avg:rows.length?revenue/rows.length:0,methods,top,slow,hourly,trend,from:state.reportPeriod==='custom'?state.reportFrom:from.toISOString().slice(0,10),to:new Date(to.getTime()-86400000).toISOString().slice(0,10),previousRevenue,loading:false};
}

async function loadStockMovements(){

  .select('id,product_id,movement_type,quantity,reference_id,note,created_at,products(name,sku,unit)')
  .order('created_at',{ascending:false}).limit(100);
 if(error){toast('Gagal memuat histori stok: '+error.message);return}
 state.stockMoves=(data||[]).map(m=>({
   id:m.id,product_id:m.product_id,movement_type:m.movement_type,quantity:Number(m.quantity||0),

 ]);
 if(ce||pe){toast((ce||pe).message);return}

 const refreshorders=document.getElementById('refreshorders');if(refreshorders)refreshorders.onclick=async()=>{await loadOrders();render()};
 const ordersearch=document.getElementById('ordersearch');if(ordersearch)ordersearch.oninput=e=>{state.orderQuery=e.target.value;render()};
 const ordermethod=document.getElementById('ordermethod');if(ordermethod)ordermethod.onchange=e=>{state.orderMethod=e.target.value;render()};
 const orderdate=document.getElementById('orderdate');if(orderdate)orderdate.onchange=e=>{state.orderDate=e.target.value;render()};
 document.querySelectorAll('[data-order-detail]').forEach(b=>b.onclick=()=>{state.selectedOrder=state.orderRows.find(x=>String(x.id)===String(b.dataset.orderDetail))||null;render()});
 const closeOrder=()=>{state.selectedOrder=null;render()};
 const cod=document.getElementById('closeorderdetail');if(cod)cod.onclick=closeOrder;
 const cod2=document.getElementById('closeorderdetail2');if(cod2)cod2.onclick=closeOrder;
 const odb=document.getElementById('orderdetailbackdrop');if(odb)odb.onclick=e=>{if(e.target.id==='orderdetailbackdrop')closeOrder()};
 const por=document.getElementById('printorderreceipt');if(por)por.onclick=()=>window.print();

 const closepay=document.getElementById('closepay');if(closepay)closepay.onclick=()=>{state.modal=false;render()};
 document.querySelectorAll('[data-paytab]').forEach(b=>b.onclick=()=>{state.paytab=b.dataset.paytab;render()});
 const received=document.getElementById('received');if(received){received.oninput=e=>{state.received=e.target.value.replace(/[^0-9]/g,'');render();const r=document.getElementById('received');r.focus();r.setSelectionRange(r.value.length,r.value.length)}}
 document.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>{state.received=b.dataset.quick;render()});
 const confirm=document.getElementById('confirm');if(confirm)confirm.onclick=confirmPay;
 const clearcart=document.getElementById('clearcart');if(clearcart)clearcart.onclick=()=>{state.cart=[];render()};
 const cam=document.getElementById('cam');if(cam)cam.onclick=()=>toast('Mode kamera demo: integrasi scanner kamera sungguhan kita pasang di V1');
 const print=document.getElementById('print');if(print)print.onclick=()=>window.print();
 const enota=document.getElementById('enota');if(enota)enota.onclick=()=>toast('E-Nota demo: integrasi WhatsApp/email ditambahkan di V1');
 const newtx=document.getElementById('newtx');if(newtx)newtx.onclick=newTx;
  const savebusiness=document.getElementById('savebusiness');
 if(savebusiness)savebusiness.onclick=async()=>{
   if(state.role!=='admin'){toast('Hanya Admin yang dapat mengubah pengaturan');return}
   const input=document.getElementById('businessname');
   const name=String(input?.value||'').trim()||'ZEYA';
   const msg=document.getElementById('businessmsg');
   const {error}=await sb.from('settings').upsert({key:'business_name',value:{name},updated_at:new Date().toISOString()},{onConflict:'key'});
   if(error){if(msg)msg.textContent='Gagal menyimpan: '+error.message;return}
   state.businessName=name;
   if(msg)msg.textContent=`Nama warung berhasil disimpan: ${name}`;
   toast('Nama warung tersimpan');
   render();
 };
 const savetax=document.getElementById('savetax');
 if(savetax)savetax.onclick=async()=>{
   if(state.role!=='admin'){toast('Hanya Admin yang dapat mengubah pengaturan');return}
   const input=document.getElementById('taxrate');
   const rate=Math.max(0,Math.min(100,Number(input?.value||0)));
   const msg=document.getElementById('settingsmsg');
   const {error}=await sb.from('settings').upsert({key:'tax_rate',value:{rate},updated_at:new Date().toISOString()},{onConflict:'key'});
   if(error){if(msg)msg.textContent='Gagal menyimpan: '+error.message;return}
   state.taxRate=rate;
   if(msg)msg.textContent=`Tarif pajak berhasil disimpan: ${rate}%`;
   toast('Pengaturan pajak tersimpan');
   render();
 };
const newitem=document.getElementById('newitem');
 if(newitem)newitem.onclick=()=>{state.editId=null;state.pendingImage='';render()};
 document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{state.editId=b.dataset.edit;const p=state.products.find(x=>String(x.id)===String(state.editId));state.pendingImage=p?.image||'';render()});
 const cancelitem=document.getElementById('cancelitem');
 if(cancelitem)cancelitem.onclick=()=>{state.editId=null;state.pendingImage='';render()};
 document.querySelectorAll('[data-icon]').forEach(b=>b.onclick=()=>{
   const e=document.getElementById('femo');if(e)e.value=b.dataset.icon;
   document.querySelectorAll('[data-icon]').forEach(x=>x.classList.toggle('active',x.dataset.icon===b.dataset.icon));
   const p=document.getElementById('iconpreview');if(p)p.textContent=b.dataset.icon;
   const title=document.getElementById('phototitle');if(title)title.textContent='Icon pilihan';
   const name=document.getElementById('photoname');if(name)name.textContent='Menggunakan icon yang dipilih.';
 });
 const femo=document.getElementById('femo');
 if(femo)femo.oninput=e=>{document.querySelectorAll('[data-icon]').forEach(x=>x.classList.toggle('active',x.dataset.icon===e.target.value));const p=document.getElementById('iconpreview');if(p)p.textContent=e.target.value||'🛍️'};
 const imageInput=document.getElementById('fimage');
 if(imageInput)imageInput.onchange=e=>{
   const file=e.target.files&&e.target.files[0];if(!file)return;
   if(file.size>2*1024*1024){toast('Ukuran foto maksimal 2 MB');imageInput.value='';return}
   const reader=new FileReader();
   reader.onload=()=>{
     state.pendingImage=reader.result;
     const p=document.getElementById('iconpreview');if(p)p.innerHTML=`<img src="${reader.result}" alt="Preview" style="width:100%;height:100%;object-fit:contain;border-radius:14px">`;
     const title=document.getElementById('phototitle');if(title)title.textContent='Foto dari Komputer';
     const name=document.getElementById('photoname');if(name)name.textContent=file.name;
     document.querySelectorAll('[data-icon]').forEach(x=>x.classList.remove('active'));
   };
   reader.readAsDataURL(file)
 };
 const removeimage=document.getElementById('removeimage');
 if(removeimage)removeimage.onclick=()=>{
   state.pendingImage='';
   const p=document.getElementById('iconpreview');if(p)p.textContent=document.getElementById('femo')?.value||'🛍️';
   const title=document.getElementById('phototitle');if(title)title.textContent='Icon pilihan';
   const name=document.getElementById('photoname');if(name)name.textContent='Foto akan dihapus saat disimpan';
   const imageInput=document.getElementById('fimage');if(imageInput)imageInput.value='';
 };
 const save=document.getElementById('saveitem');
 if(save)save.onclick=async()=>{
   if(state.role!=='admin'){toast('Hanya Admin yang dapat mengubah master barang');return}
   const existing=state.editId?state.products.find(x=>String(x.id)===String(state.editId)):null;
   const catSelect=document.getElementById('fcat');
   const categoryId=catSelect?.value||null;
   const data={
     sku:document.getElementById('fsku').value.trim(),
     name:document.getElementById('fname').value.trim(),
     category_id:categoryId,
     unit:document.getElementById('funit').value.trim()||'pcs',
     purchase_price:Number(document.getElementById('fbuy').value||0),
     selling_price:Number(document.getElementById('fprice').value||0),
     stock:Number(document.getElementById('fstock').value||0),
     minimum_stock:Number(document.getElementById('fminstock').value||0),
     image_data:state.pendingImage || null,
     image_url:null,
     is_active:true
   };
   const msg=document.getElementById('stockformmsg');
   if(!data.sku||!data.name||data.selling_price<=0||data.stock<0||data.minimum_stock<0){if(msg)msg.textContent='Lengkapi SKU, nama, harga jual, dan stok dengan benar.';return}
   if(state.editId){
     const oldStock=Number(existing?.stock||0);
     const {error}=await sb.from('products').update(data).eq('id',state.editId);
     if(error){if(msg)msg.textContent='Gagal menyimpan: '+error.message;return}
     const delta=data.stock-oldStock;
     if(delta!==0){
       const {error:me}=await sb.from('stock_movements').insert([{product_id:state.editId,movement_type:'adjustment',quantity:delta,note:'Penyesuaian stok dari Master Barang'}]);
       if(me){if(msg)msg.textContent='Barang tersimpan, histori stok gagal: '+me.message;return}
     }
     toast('Perubahan barang tersimpan');
   }else{
     const {data:created,error}=await sb.from('products').insert([data]).select('id').single();
     if(error){if(msg)msg.textContent='Gagal menambah barang: '+error.message;return}
     if(data.stock>0){
       const {error:me}=await sb.from('stock_movements').insert([{product_id:created.id,movement_type:'opening',quantity:data.stock,note:'Stok awal dari Master Barang'}]);
       if(me){if(msg)msg.textContent='Barang dibuat, histori stok gagal: '+me.message;return}
     }
     toast('Barang baru berhasil ditambahkan');
   }
   state.editId=null;state.pendingImage='';await loadProducts();await loadStockMovements();render();
 }
}
setInterval(()=>{const c=document.getElementById('clock');if(c)c.textContent=time()},1000);
sb.auth.getSession().then(({data})=>bootSession(data.session));
sb.auth.onAuthStateChange((_event,session)=>{if(session&&!state.logged)bootSession(session);});
</script>
