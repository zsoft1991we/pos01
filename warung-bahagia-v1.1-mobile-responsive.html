<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Warung Bahagia POS V1.1 Mobile</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f8f3}#appFrame{width:100%;height:100%;border:0;display:block}</style>
</head>
<body>
<iframe id="appFrame" src="warung-bahagia-v1.0-void.html?v=responsive-mobile1" title="Warung Bahagia POS"></iframe>
<script>
(function(){'use strict';
const frame=document.getElementById('appFrame');
function core(){try{const outer=frame.contentDocument;return outer&&outer.querySelector('#appFrame')?.contentDocument||null}catch(e){return null}}
function addStyle(d){if(!d||d.getElementById('wb-mobile-responsive-style'))return;if(!/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent||''))return;const s=d.createElement('style');s.id='wb-mobile-responsive-style';s.textContent=`
/* MOBILE ONLY: presentation/responsive sizing. No business logic or custom navigation. */
html,body{min-width:0!important;width:100%!important;max-width:100vw!important;overflow-x:hidden!important}
.sidebar{display:none!important}
.content{margin-left:0!important;width:100%!important;min-width:0!important}
.app-shell{display:block!important;min-height:100vh!important}
.topbar{padding:8px 9px!important;position:sticky!important;top:0!important;z-index:20!important}
.topbar-row{display:block!important;position:relative!important;min-width:0!important}
.welcome{min-width:0!important;max-width:calc(100vw - 90px)!important;padding:0!important;overflow:hidden!important}
.welcome b{display:block!important;font-size:15px!important;line-height:1.15!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
.welcome small{font-size:9px!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
.top-user{position:absolute!important;right:0!important;top:0!important;max-width:76px!important}
.top-user>div:first-child{display:none!important}
.top-user .avatar{width:32px!important;height:32px!important}
.clockbox{display:none!important}
.search-shell{grid-template-columns:minmax(0,1fr) 40px!important;gap:6px!important;margin-top:7px!important}
.search-box{min-height:40px!important;border-radius:12px!important}
.search-box input{font-size:12px!important;padding:0 10px!important}
.camera{width:40px!important;height:40px!important;border-radius:12px!important}
main{padding:8px!important;margin:0!important;max-width:none!important}
.posgrid{display:flex!important;flex-direction:column!important;gap:8px!important}
.catalog{order:2!important;padding:7px!important;border-radius:14px!important}
.tabs{display:flex!important;overflow-x:auto!important;gap:5px!important;padding-bottom:6px!important;scrollbar-width:none!important}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto!important;min-height:34px!important;padding:6px 10px!important;border-radius:10px!important;font-size:10px!important}
.products{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:7px!important}
.product{min-width:0!important;border-radius:12px!important}
.pic{height:76px!important;font-size:30px!important}
.pic img{padding:5px!important}
.pbody{padding:7px!important}
.pname{font-size:11px!important;min-height:26px!important;line-height:1.18!important}
.price{font-size:12px!important;margin-top:3px!important}
.stock{font-size:9px!important}
.soldout{font-size:8px!important;padding:3px 6px!important}
.cart{order:1!important;position:static!important;width:100%!important;min-height:0!important;height:auto!important;max-height:none!important;padding:10px!important;border-radius:14px!important;box-sizing:border-box!important}
.cart-head h2{font-size:15px!important}
.clear-cart{font-size:9px!important;padding:6px 8px!important}
.cartlist{max-height:185px!important;margin-top:7px!important;overflow:auto!important}
.lineitem{padding:7px!important;border-radius:10px!important}
.linehead strong,.lineprice{font-size:10px!important}
.step{gap:5px!important}.step button{width:32px!important;height:32px!important}
.summary{margin-top:7px!important;padding-top:7px!important}.sumrow{font-size:10px!important;margin:4px 0!important}.total{font-size:16px!important}
.pay{min-height:46px!important;padding:10px!important;border-radius:12px!important;font-size:14px!important;margin-top:7px!important}
.empty{height:64px!important;font-size:11px!important}
.pagehead{margin-bottom:7px!important}.pagehead h1{font-size:18px!important}.pagehead p{font-size:10px!important}
.stockgrid,.reportgrid,.successgrid{display:block!important}
.formcard{padding:9px!important;border-radius:14px!important;margin-bottom:8px!important}
.tablewrap{overflow-x:auto!important}
.table{min-width:620px!important;font-size:9px!important}.table th,.table td{padding:6px 7px!important}
.metrics{grid-template-columns:1fr!important;gap:7px!important}.metric{padding:11px!important}.metric .num{font-size:21px!important}
.chart,.top5{padding:10px!important;margin-bottom:8px!important}.chartbox{height:180px!important}
.modal{padding:8px!important;place-items:start center!important}
.modalbox{width:100%!important;max-width:430px!important;max-height:calc(100dvh - 16px)!important;overflow:auto!important;border-radius:17px!important;padding:12px!important;margin:0!important}
.paytabs button{min-height:38px!important;padding:7px 5px!important;font-size:10px!important}
.cashbig{font-size:25px!important}.quick button{min-height:38px!important;padding:7px 4px!important;font-size:10px!important}
.changebox{margin-top:9px!important;padding:10px!important}.changebox strong{font-size:27px!important}.confirm{min-height:44px!important;padding:10px!important;font-size:12px!important}
.receiptpage{min-height:100vh!important;padding:8px!important;overflow:auto!important;box-sizing:border-box!important}
.receiptpage .successgrid{display:block!important;max-width:430px!important;margin:0 auto!important}
.receiptpage .successbox{padding:12px!important;margin-bottom:7px!important;border-radius:15px!important}
.receiptpage .successbox .return{font-size:30px!important}
.receiptpage .receiptcard{padding:9px!important;border-radius:15px!important}
.receiptpage .receipt{width:100%!important;max-width:350px!important;margin:0 auto!important}
.receiptpage button{min-height:40px!important}
`;
d.head.appendChild(s)}
function apply(){const d=core();if(d)addStyle(d)}
frame.addEventListener('load',()=>setTimeout(apply,120));setInterval(apply,900);apply();
})();
</script>
</body>
</html>
