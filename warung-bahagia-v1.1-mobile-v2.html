function getVoid(){try{return outer.contentDocument||null}catch(e){return null}}

function getCore(){try{var f=getCoreFrame();return f&&f.contentDocument}catch(e){return null}}
function mobile(d){return !!d&&!!d.body}
function inject(d){if(!mobile(d))return false;if(!d.getElementById('wb11compactstyle')){var s=d.createElement('style');s.id='wb11compactstyle';s.textContent=STYLE;d.head.appendChild(s)}ensureNav(d);ensureCart(d);return true}

function ensureNav(d){var side=d.querySelector('.side-nav');if(!side)return;var nav=d.getElementById('wb11nav');if(!nav){nav=d.createElement('nav');nav.id='wb11nav';nav.className='wb-bottomnav';d.body.appendChild(nav)}var srcs=[].slice.call(side.querySelectorAll('button'));var sig=srcs.map(function(x){return (x.innerText||'').trim()}).join('|');if(nav.dataset.sig!==sig){nav.dataset.sig=sig;nav.innerHTML='';srcs.forEach(function(src,i){var b=d.createElement('button');b.type='button';var ic=d.createElement('span');ic.className='wb-nav-ico';ic.textContent=(src.querySelector('.ico')||{}).textContent||'•';var lab=d.createElement('span');lab.textContent=labelOf(src);b.appendChild(ic);b.appendChild(lab);b.onclick=function(){closeCart(d);src.click();setTimeout(function(){syncNav(d)},80)};nav.appendChild(b)})}syncNav(d)}
function ensureCart(d){var cart=d.querySelector('.cart');if(!cart)return;var scr=d.getElementById('wb11scrim');if(!scr){scr=d.createElement('div');scr.id='wb11scrim';scr.className='wb-scrim';d.body.appendChild(scr);scr.onclick=function(){closeCart(d)}}var btn=d.getElementById('wb11cart');if(!btn){btn=d.createElement('button');btn.id='wb11cart';btn.className='wb-cart';btn.type='button';btn.onclick=function(){var open=!cart.classList.contains('wb-mobile-open');cart.classList.toggle('wb-mobile-open',open);scr.classList.toggle('show',open);btn.classList.toggle('show',true)}}updateCart(d,btn)}
function closeCart(d){var c=d.querySelector('.cart');if(c)c.classList.remove('wb-mobile-open');var s=d.getElementById('wb11scrim');if(s)s.classList.remove('show');var b=d.getElementById('wb11cart');if(b&&d.querySelector('.cart .lineitem')){var t=d.querySelector('.cart .total');b.textContent=t?'Keranjang · '+t.innerText.trim():'Keranjang'}}
function updateCart(d,b){var c=d.querySelector('.cart');if(!c){b.classList.remove('show');return}var items=d.querySelectorAll('.cart .lineitem');if(!items.length){b.classList.remove('show');return}var t=d.querySelector('.cart .total');b.textContent='Keranjang'+(t?' · '+t.innerText.trim():'');b.classList.add('show')}
function refresh(){var d=getCore();if(!d)return;inject(d);updateCart(d,d.getElementById('wb11cart'));}
function attach(){var vf=getCoreFrame();if(!vf)return;vf.addEventListener('load',function(){setTimeout(refresh,100)});setTimeout(refresh,150);setTimeout(refresh,700);setTimeout(refresh,1800);try{var d=getCore();if(d){inject(d);observer&&observer.disconnect();observer=new MutationObserver(refresh);observer.observe(d.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class']})}}catch(e){}}
